<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLFREND 予約キャンセル</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
  color: #222;
}
main {
  max-width: 440px;
  margin: auto;
  background: white;
  padding: 30px 20px;
  border-radius: 12px;
}
h1 {
  text-align: center;
  letter-spacing: 3px;
}
.subtitle {
  text-align: center;
  color: #777;
}
button {
  width: 100%;
  padding: 20px;
  margin-top: 25px;
  background: #222;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 20px;
}
</style>
</head>
<body>
<main>
<h1>GOLFREND</h1>
<p class="subtitle">RESERVATION CANCEL</p>

<h2>予約キャンセル確認</h2>

<div id="reservationInfo">
  <p>予約情報を確認しています...</p>
</div>

<p>以下の予約をキャンセルしますか？</p>

<button id="cancelButton" disabled>
  キャンセルを確定する
</button>

<p id="message"></p>
</main>
</body>
</html>
