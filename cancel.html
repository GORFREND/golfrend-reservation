<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<title>GOLFREND 予約キャンセル</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
  color: #222;
}
main {
  max-width: 440px;
  margin: auto;
  background: white;
  padding: 30px 20px;
  border-radius: 12px;
}
h1 {
  text-align: center;
  letter-spacing: 3px;
}
.subtitle {
  text-align: center;
  color: #777;
}
button {
  width: 100%;
  padding: 20px;
  margin-top: 25px;
  background: #222;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 20px;
}
</style>
</head>
<body>
<main>
<h1>GOLFREND</h1>
<p class="subtitle">RESERVATION CANCEL</p>

<h2>予約キャンセル確認</h2>

<div id="reservationInfo">
  <p>予約情報を確認しています...</p>
</div>

<p>以下の予約をキャンセルしますか？</p>

<button id="cancelButton" disabled>
  キャンセルを確定する
</button>

<p id="message"></p>
</main>
  <script>
async function initCancelLiff() {
  const message = document.getElementById('message');

  message.textContent = 'LINE認証を確認しています...';

  try {
    await liff.init({
      liffId: '2012432284-iEd06CLr'
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error('LINE認証情報を取得できませんでした。');
    }

window.cancelIdToken = idToken;
message.textContent = '予約情報を取得しています...';

await loadCancelReservationInfo(idToken);

  } catch (error) {
    message.textContent = 'LINE認証エラー：' + error.message;
  }
}
// キャンセル対象の予約番号をURLから取得
const params = new URLSearchParams(window.location.search);
const cancelReservationId = params.get('reservationId');
// LINE認証後にキャンセル対象の予約情報を取得
async function loadCancelReservationInfo(idToken) {
  const info = document.getElementById('reservationInfo');
  const message = document.getElementById('message');

  if (!cancelReservationId) {
    info.textContent = '予約番号が指定されていません。';
    message.textContent = '';
    return;
  }

  try {
    message.textContent = 'GASに予約情報を問い合わせています...';
    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbwvw4D-oSsd4Xm42Y5_TKOUXqM-pKgV-AIImVCFGadpipOHaRj766uiWkG4dKcLce0-WQ/exec',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify({
          action: 'cancelInfo',
          idToken: idToken,
          reservationId: cancelReservationId
        })
      }
    );

    const result = await response.json();

    if (!result.success) {
      throw new Error(result.message || '予約情報を取得できません。');
    }

    const r = result.reservation;

    info.style.whiteSpace = 'pre-line';
    info.textContent =
      '店舗：' + r.shop + '\n' +
      '利用日：' + r.date + '\n' +
      '開始時間：' + r.time + '\n' +
      '氏名：' + r.name + '\n' +
      '予約状態：' + r.status;

    message.textContent = '予約情報を確認してください。';

  } catch (error) {
    info.textContent = '予約情報を表示できませんでした。';
    message.textContent = error.message;
  }
}
window.addEventListener('load', initCancelLiff);
</script>
</body>
</html>
