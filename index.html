<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOLFREND 予約</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 5px;
  color: #222;
}

main {
  background: white;
  min-height: 100vh;
  padding: 22px 18px 45px;
  border-radius: 8px;
}

h1 {
  text-align: center;
  letter-spacing: 4px;
  font-size: 30px;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  letter-spacing: 2px;
  font-size: 15px;
  color: #666;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 25px;
  font-size: 21px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 20px;
  margin-top: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 22px;
  background: white;
}

button {
  width: 100%;
  padding: 22px;
  margin-top: 30px;
  background: #222;
  color: white;
  border: 0;
  border-radius: 8px;
  font-size: 22px;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

.note {
  color: #777;
  font-size: 14px;
  margin-top: 5px;
}

#message {
  margin-top: 18px;
  line-height: 1.7;
  font-size: 16px;
}
</style>
</head>

<body>
<main>

<h1>GOLFREND</h1>
<p class="subtitle">SIMULATION GOLF</p>

<label for="shop">店舗</label>
<select id="shop">
  <option value="十和田店">十和田店</option>
  <option value="三沢店">三沢店</option>
</select>

<label for="date">利用日</label>
<input type="date" id="date">

<label for="time">開始時間</label>
<select id="time">
  <option value="">利用日を選択してください</option>
</select>

<p class="note">利用時間は60分です。</p>

<label for="name">氏名</label>
<input id="name" placeholder="氏名を入力">

<label for="line">LINE名</label>
<input id="line" placeholder="任意入力">

<label for="phone">電話番号</label>
<input id="phone" type="tel" placeholder="電話番号を入力">

<label for="type">利用区分</label>
<select id="type">
  <option value="一般">一般</option>
  <option value="会員">会員</option>
</select>

<label for="plan">会員プラン</label>
<select id="plan" disabled>
  <option value="">選択してください</option>
  <option value="5回プラン">5回プラン</option>
  <option value="10回プラン">10回プラン</option>
</select>

<button id="send" disabled onclick="sendReservation()">予約を申し込む</button>

<div id="message">
  現在、予約システムを準備しています。
</div>

</main>

<script>
const dateInput = document.getElementById('date');
const timeInput = document.getElementById('time');
const typeInput = document.getElementById('type');
const planInput = document.getElementById('plan');

const today = new Date();
const localToday = new Date(
  today.getTime() - today.getTimezoneOffset() * 60000
).toISOString().slice(0, 10);

dateInput.min = localToday;

typeInput.addEventListener('change', function() {
  planInput.disabled = typeInput.value !== '会員';

  if (typeInput.value !== '会員') {
    planInput.value = '';
  }
});

dateInput.addEventListener('change', async function() {
  timeInput.innerHTML =
    '<option value="">接続テスト中...</option>';

  const url =
    'https://script.google.com/macros/s/AKfycbwvw4D-oSsd4Xm42Y5_TKOUXqM-pKgV-AIImVCFGadpipOHaRj766uiWkG4dKcLce0-WQ/exec' +
    '?action=slots' +
    '&shop=' + encodeURIComponent(document.getElementById('shop').value) +
    '&date=' + encodeURIComponent(dateInput.value);

  try {
    const response = await fetch(url);
    const result = await response.json();

    timeInput.innerHTML =
      '<option value="">時間を選択してください</option>';

    (result.slots || []).forEach(function(slot) {
      const option = document.createElement('option');
      option.value = slot;
      option.textContent = slot;
      timeInput.appendChild(option);
    });

  } catch (error) {
    timeInput.innerHTML =
      '<option value="">接続できませんでした</option>';
    console.error(error);
  }
});
</script>
<script>
async function initLiff() {
  const message = document.getElementById('message');

  message.textContent = 'LINE認証を確認しています...';

  try {
    await liff.init({
      liffId: '2012432284-iEd06CLr'
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    window.lineIdToken = liff.getIDToken();
    if (profile.userId) {
      message.textContent =
        'LINE認証に成功しました！';
      document.getElementById('send').disabled = false;
    } else {
      message.textContent =
        'LINEユーザーIDを取得できませんでした。';
    }

  } catch (error) {
    message.textContent =
      'LINE認証エラー：' + error.message;
  }
}

window.addEventListener('load', initLiff);
</script>
<script>

  // LINE認証付き予約申請
async function sendReservation() {
  const message = document.getElementById('message');
  const button = document.getElementById('send');

  if (!window.lineIdToken) {
    message.textContent = 'LINE認証が必要です。';
    return;
  }

  const data = {
    action: 'reserve',
    idToken: window.lineIdToken,
    shop: document.getElementById('shop').value,
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    name: document.getElementById('name').value.trim(),
    line: document.getElementById('line').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    type: document.getElementById('type').value,
    plan: document.getElementById('plan').value
  };

  if (!data.date || !data.time || !data.name || !data.phone) {
    message.textContent = '入力されていない項目があります。';
    return;
  }

  if (data.type === '会員' && !data.plan) {
    message.textContent = '会員プランを選択してください。';
    return;
  }

  button.disabled = true;
  message.textContent = '予約を申し込んでいます...';

  try {
    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbwvw4D-oSsd4Xm42Y5_TKOUXqM-pKgV-AIImVCFGadpipOHaRj766uiWkG4dKcLce0-WQ/exec',
      {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();
    message.textContent = result.message ||
      '予約処理の結果を取得できませんでした。';

  } catch (error) {
    message.textContent =
      '通信エラーが発生しました。予約状況を確認してください。';
    console.error(error);
  } finally {
    button.disabled = false;
  }
}
</script>

</body>
</html>
